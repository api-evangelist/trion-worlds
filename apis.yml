name: Trion Worlds
description: 'Trion Worlds was an American video game developer and MMO publisher founded in 2006 in
  Redwood City, California by Lars Buttler and Jon Van Caneghem, and backed early by Trinity Ventures
  among others. It developed and operated massively multiplayer titles including Rift, Defiance, Trove
  and Atlas Reactor, published ArcheAge in Western markets, and ran the Glyph game-distribution client.
  The company was acquired by German publisher Gamigo in October 2018 and disbanded shortly after; its
  games, the Glyph platform and the trionworlds.com domain are now operated by Gamigo. Trion Worlds
  never published a public developer API or developer program, so this network profile carries company
  identity and domain-security signals only. Surfaced as a portfolio company of Trinity Ventures.'
